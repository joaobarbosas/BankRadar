name: .NET build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore BankRadar.csproj && dotnet restore tests/BankRadar.Tests/BankRadar.Tests.csproj
      - name: Build
        run: dotnet build BankRadar.csproj --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test tests/BankRadar.Tests/BankRadar.Tests.csproj --configuration Release --verbosity normal
